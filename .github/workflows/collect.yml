# 평일 저녁 KAMIS 가격을 받아 data/prices.json을, 참가격 이마트 값(새 달이 있을 때만)을 받아
# data/emart.json을 커밋하고, GitHub Pages에 배포한다.
# Actions가 기본 토큰으로 푸시한 커밋은 다른 워크플로를 깨우지 않으므로, 수집과 배포를 한 워크플로에 둔다.
name: collect

on:
  schedule:
    # 평일 한국 시각 19시(UTC 10시). 키를 받은 뒤 KAMIS가 그날 값을 올리는 시각을 보고 다시 정한다.
    - cron: "0 10 * * 1-5"
  workflow_dispatch:
    inputs:
      remake_items:
        description: "품종 목록도 다시 만들기(KAMIS가 품종이나 조사 단위를 바꿨을 때)"
        type: boolean
        default: false
  push:
    branches: [main]

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    # 사람이 코드를 푸시했을 때는 수집하지 않고 배포만 한다.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # KAMIS가 응답 없이 매달려도 몇 시간씩 돌지 않게 한다(보통은 몇 분).
    # 참가격 단계는 자기 제한(15분)이 따로 있고, 그 몫을 더해 넉넉히 둔다.
    timeout-minutes: 45
    permissions:
      contents: write
    # 맨 끝 emart-check가 참가격 단계와 그 커밋 단계의 결과를 본다.
    outputs:
      emart: ${{ steps.emart.outcome }}
      emart_commit: ${{ steps.emart_commit.outcome }}
    env:
      KAMIS_CERT_KEY: ${{ secrets.KAMIS_CERT_KEY }}
      KAMIS_CERT_ID: ${{ secrets.KAMIS_CERT_ID }}
      DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
    steps:
      - name: 키 확인
        id: key
        run: |
          if [ -z "$KAMIS_CERT_KEY" ] || [ -z "$KAMIS_CERT_ID" ]; then
            echo "KAMIS 키 없음: KAMIS 수집을 건너뜁니다"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # 참가격은 KAMIS 키가 없어도 돌므로 받아 오기와 uv는 늘 준비한다.
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # "Run workflow"에서 고른 때만 돈다. 실패하면(한 부류라도 못 받음) 목록은 그대로 두고 멈춘다.
      - name: 품종 목록 다시 만들기
        if: steps.key.outputs.ready == 'true' && inputs.remake_items
        run: uv run python -m collector.make_items

      - name: 수집
        if: steps.key.outputs.ready == 'true'
        # 품종 목록을 다시 만든 날은 기준일이 같아도 새 목록으로 다시 쓴다.
        env:
          FORCE: ${{ inputs.remake_items && '--force' || '' }}
        run: uv run python -m collector $FORCE

      - name: 바뀌었으면 커밋·푸시
        if: steps.key.outputs.ready == 'true'
        run: |
          if git diff --quiet -- data/prices.json collector/items.json; then
            echo "가격 파일과 품종 목록이 그대로라 커밋하지 않습니다"
            exit 0
          fi
          as_of=$(python3 -c "import json; print(json.load(open('data/prices.json', encoding='utf-8'))['as_of'])")
          message="chore(data): ${as_of} 가격 갱신"
          if ! git diff --quiet -- collector/items.json; then
            message="${message}, 품종 목록 다시 만듦"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json collector/items.json
          git commit -m "${message}"
          # 기다리는 사이 다른 실행이나 사람이 먼저 푸시했어도 거절되지 않게 받아 온 뒤 푸시한다.
          # 봇은 data/prices.json만 바꾸므로 보통 충돌하지 않는다.
          git pull --rebase
          git push

      # 키(DATA_GO_KR_KEY)가 없으면 "참가격 키 없음"을 남기고 성공으로 끝난다.
      # 실패해도 KAMIS 커밋과 배포는 하고, 맨 끝 emart-check에서 실행을 실패로 끝낸다.
      # KAMIS 단계가 실패한 날은 여기까지 오지 않고 다음 실행에서 받는다.
      # 새 달이 있는 날은 3개 달을 쪽마다 70번쯤 받는다. 느린 날 작업 전체가 시간 제한에 걸리면
      # continue-on-error로도 받지 못해 배포(그날 KAMIS 가격)까지 빠지므로, 이 단계에 따로 제한을 둔다.
      - name: 이마트 값(참가격) 받기
        id: emart
        continue-on-error: true
        timeout-minutes: 15
        run: uv run python -m collector.emart

      - name: 이마트 파일 바뀌었으면 커밋·푸시
        id: emart_commit
        if: steps.emart.outcome == 'success'
        # 받아 오기나 푸시가 거절돼도 작업이 실패로 끝나면 배포(그날 KAMIS 가격)까지 빠지므로 넘어가고,
        # 맨 끝 emart-check에서 실행을 실패로 끝낸다.
        continue-on-error: true
        # git diff가 아니라 git status로 본다. 첫 실행에서 data/emart.json은 git이 아직 모르는
        # 새 파일이라 git diff로는 바뀐 것이 없다고 나온다.
        run: |
          if [ -z "$(git status --porcelain -- data/emart.json)" ]; then
            echo "이마트 파일이 그대로라 커밋하지 않습니다"
            exit 0
          fi
          as_of=$(python3 -c "import json; print(json.load(open('data/emart.json', encoding='utf-8'))['as_of'])")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/emart.json
          git commit -m "chore(data): 이마트 ${as_of} 값 갱신"
          git pull --rebase
          git push

  deploy:
    needs: collect
    # 수집이 성공했거나 건너뛰었을 때(키 없음, 코드 푸시) 배포한다. 수집이 실패하면 지금 사이트를 그대로 둔다.
    if: always() && needs.collect.result != 'failure' && needs.collect.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 화면 파일만 모으기
        run: |
          mkdir _site
          cp -r index.html style.css app.js store.js sw.js manifest.webmanifest icons fonts data _site/

      # 묶음 이름에 몇 번째 시도인지 붙인다. 같은 이름이면 "Re-run"으로 다시 돌릴 때
      # 앞 시도의 묶음이 남아 2개가 되고, 배포가 어느 것을 쓸지 몰라 멈춘다.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  # 참가격을 받지 못했거나 커밋하지 못한 날은 배포까지 마친 뒤 실행을 실패로 끝내 GitHub이 메일로 알리게 한다.
  emart-check:
    needs: [collect, deploy]
    if: always() && (needs.collect.outputs.emart == 'failure' || needs.collect.outputs.emart_commit == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: 이마트 값 확인
        run: |
          echo "이마트 값(참가격)을 받거나 커밋하지 못했습니다. 사이트의 data/emart.json은 그대로입니다. collect 작업의 '이마트 값(참가격) 받기'와 '이마트 파일 바뀌었으면 커밋·푸시' 기록을 보세요."
          exit 1
