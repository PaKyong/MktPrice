<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1E2A22">
  <meta name="description" content="대형마트 가격표가 적당한지 KAMIS 소매가격으로 바로 비교해요.">
  <title>장보기 가격</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <p id="banner-sample" class="banner banner--sample" hidden>샘플 데이터예요. 실제 가격이 아니에요</p>
    <p id="banner-offline" class="banner banner--offline" hidden></p>
    <div class="top__title">
      <h1>장보기 가격</h1>
      <p id="asof" class="asof"></p>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <footer id="dock" class="dock">
    <div id="dock-list">
      <div id="total" class="total" hidden></div>
      <form id="search-form" class="search" role="search">
        <input id="search" type="search" placeholder="품목 검색 (예: 양파)" autocomplete="off"
               enterkeyhint="search" aria-label="품목 검색">
        <button type="button" id="search-clear" class="search__clear" aria-label="검색 지우기" hidden>✕</button>
      </form>
    </div>
    <div id="dock-detail" hidden></div>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
