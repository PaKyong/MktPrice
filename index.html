<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="description" content="대형마트 가격표가 적당한지 KAMIS 소매가격으로 바로 비교해요.">
  <meta name="apple-mobile-web-app-title" content="장보기 가격">
  <title>장보기 가격</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/mkt-sans.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="bar-detail" class="bar bar--detail" hidden>
    <button type="button" id="back" class="icon-btn" aria-label="뒤로">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
    </button>
    <button type="button" id="star" class="icon-btn" aria-label="즐겨찾기에 넣기" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"
           aria-hidden="true"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>
    </button>
  </header>

  <div id="home-head" class="head">
    <div id="home-title">
      <h1 class="head__title">장보기 가격</h1>
      <p id="asof" class="head__asof"></p>
    </div>
    <p id="print-sample" class="band" hidden>샘플 값이에요. 실제 가격이 아니에요.</p>
    <p id="print-offline" class="band" hidden></p>
    <p id="print-stale" class="band" hidden></p>
    <div id="banner-install" class="note" hidden>
      <span>홈 화면에 추가하면 앱처럼 쓰고, 인터넷 없이도 열려요</span>
      <button type="button" id="install-close">닫기</button>
    </div>
  </div>

  <main id="view" class="view" tabindex="-1"></main>

  <!-- 아래 검색창: 한 손으로 쥐었을 때 엄지가 닿는 곳 -->
  <form id="search-form" class="search" role="search">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
         aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="M13.5 13.5 17 17"/></svg>
    <input id="search" type="search" placeholder="품목 검색 (예: 양파)" autocomplete="off"
           enterkeyhint="search" aria-label="품목 검색">
    <button type="button" id="search-clear" class="search__clear" aria-label="검색 지우기" hidden>
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
           aria-hidden="true"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg>
    </button>
  </form>
  <div id="toast" class="toast" role="status" hidden>
    <span id="toast-text"></span>
    <button type="button" id="toast-undo">되돌리기</button>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
